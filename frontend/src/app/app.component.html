<div class="container mt-3">
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a
        class="nav-link"
        [class.active]="selectedTab() === 'summary'"
        (click)="selectedTab.set('summary')"
        style="cursor: pointer"
      >
        Summary View
      </a>
    </li>
    <li class="nav-item">
      <a
        class="nav-link"
        [class.active]="selectedTab() === 'detailed'"
        (click)="selectedTab.set('detailed')"
        style="cursor: pointer"
      >
        Detailed View
      </a>
    </li>
  </ul>

  <div class="mt-3 p-3 border border-top-0 rounded-bottom bg-light">
    @switch (selectedTab()) {
      @case ('summary') {
        <app-summary-view
          [observations]="observations()"
          (selectObservation)="selectObservation($event)"
        />
      }
      @case ('detailed') {
        @if (selectedObservation()) {
          <!-- <app-detailed-view [observation]="selectedObservation()!" /> -->
        } @else {
          <p class="text-muted">Please select an observation in Summary View.</p>
        }
      }
    }
  </div>
</div>
